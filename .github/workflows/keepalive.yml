# External safety net: the hosting platform suspends the bot's VM when it
# sees no request in flight ("excess capacity, autosuspending machine").
# The bot's own /hold streams normally prevent that; this ping wakes a
# suspended machine so it picks up its schedule. Two lessons (09-30):
# /health is answered by the platform's edge and never reaches the VM, so
# the target must be a forwarded path (/ping); and GitHub runs this cron
# only every few hours in practice, so it limits an outage, not prevents it.
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 30 https://fast-pulse-gew89.run.mcp-use.com/ping
